name: Build & Test AutoAgent

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK ───────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ── 3. Gradle cache ───────────────────────────────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 4. Permissions ────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 5. Lint / static analysis ─────────────────────────────────────────────
      - name: Run Android Lint
        run: ./gradlew lint --stacktrace
        continue-on-error: true   # Don't block build on lint warnings; fix over time

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      # ── 6. Unit tests ─────────────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

      # ── 7. Compile / assemble ─────────────────────────────────────────────────
      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ── 8. Inspect APK ────────────────────────────────────────────────────────
      - name: Show APK info
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found"
            exit 1
          fi
          echo "✅ APK found: $APK_PATH"
          du -sh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      # ── 9. Upload APK artifact ────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoAgent-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      # ── 10. Build summary ─────────────────────────────────────────────────────
      - name: Write build summary
        if: always()
        run: |
          echo "## AutoAgent Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -f "$APK_PATH" ]; then
            echo "| APK | ✅ Built successfully |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| APK | ❌ Build failed |" >> $GITHUB_STEP_SUMMARY
          fi
