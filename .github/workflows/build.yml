name: AutoAgent Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Verify APK manifest with aapt
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/aapt"
          echo "=== APK size ==="
          ls -lh $APK
          echo "=== Permissions in merged manifest ==="
          $AAPT dump permissions $APK
          echo "=== AccessibilityService in manifest ==="
          $AAPT dump xmltree $APK AndroidManifest.xml | grep -i "accessibility" \
            && echo "✅ AccessibilityService present" || echo "❌ AccessibilityService MISSING"
          echo "=== QUERY_ALL_PACKAGES permission ==="
          $AAPT dump permissions $APK | grep -i "QUERY_ALL" \
            && echo "✅ QUERY_ALL_PACKAGES present" || echo "❌ QUERY_ALL_PACKAGES MISSING — app will crash on app list"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoAgent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 7
